name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]       # 仅在 main 分支推送时构建并推送
    tags: [ 'v*.*.*' ]        # 推送版本标签时也触发（如 v1.0.0）
  pull_request:
    branches: [ "main" ]       # PR 时也运行，但不推送（仅测试能否构建）

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 设置 QEMU（支持多架构，如 arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. 设置 Buildx（启用高级构建功能和缓存）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录 GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 提取元数据（自动生成 latest、版本号、commit 等标签）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      # 5. 构建并推送（根据条件决定是否 push）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # PR 事件不推送，只构建测试
          platforms: linux/amd64,linux/arm64                # 支持多架构
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                              # 使用 GitHub Actions 缓存加速
          cache-to: type=gha,mode=max
